<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Character Audio Companion</title>
    <style>
        body {
            background-color: #eadbba;
            color: #282525;
            font-family: sans-serif, Consolas, Menlo, Monaco, "Courier New", monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        /* Selection Screen Layout */
        .selection-screen {
            background-color: #f4e8d0;
            border: 3px solid #eccb93;
            border-radius: 12px;
            padding: 35px;
            text-align: center;
            max-width: 600px;
            box-shadow: 0 8px 16px rgba(198, 198, 198, 0.5);
        }
        .skin-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 15px;
            margin-top: 25px;
        }
        .skin-card {
            background-color: #fffefa;
            border: 2px solid #ead7ba;
            border-radius: 8px;
            padding: 15px;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s;
        }
        .skin-card:hover {
            transform: translateY(-3px);
            border-color: #dbc69e;
        }
        .skin-preview {
            white-space: pre;
            font-size: 14px;
            line-height: 1.2;
            margin-bottom: 10px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        /* Main Interaction Screen (Hidden initially) */
        .character-box {
            display: none; /* Controlled via JS */
            background-color: #f4e8d0;
            border: 3px solid #eccb93;
            border-radius: 12px;
            padding: 30px;
            text-align: center;
            min-width: 300px;
            box-shadow: 0 8px 16px rgba(198, 198, 198, 0.5);
        }
        .ascii-display {
            white-space: pre;
            font-size: 24px;
            line-height: 1.4;
            margin-bottom: 25px;
            min-height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        button {
            background-color: #e0c182;
            color: rgb(10, 9, 9);
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background-color: #c6ac80; }
        button.recording { background-color: #cc241d; }
        .status-text {
            margin-top: 15px;
            font-size: 12px;
            color: #414040;
        }
        .back-btn {
            margin-top: 20px;
            background-color: #e0c182;
            font-size: 11px;
            padding: 6px 12px;
        }
    </style>
</head>
<body>

    <!-- SCREEN 1: SELECT CHARACTER -->
    <div id="selection-screen" class="selection-screen">
        <h2>Select Your Companion</h2>
        <p style="color: #aaa;">Choose one of your 5 custom skins to get started:</p>
        <div class="skin-grid" id="skin-grid"></div>
    </div>

    <!-- SCREEN 2: MAIN AUDIO EXPERIENCE -->
    <div id="main-screen" class="character-box">
        <div id="ascii-art" class="ascii-display"></div>
        <div class="controls">
            <button id="record-btn">Record Input</button>
            <button id="play-btn" disabled>Play Last Reply</button>
        </div>
        <div id="status" class="status-text">Status: Idle</div>
        <button id="change-char-btn" class="back-btn">swap character</button>
    </div>

<script>

        "happy":  { closed: "A__A\n(o̴̶̷̤`wˊo̴̶̷̤)\n  (ა    ૮)୭", open: "A__A\n꩜(o̴̶̷̤`⩌ˊo̴̶̷̤)꩜\n  (ა    ૮)୭" },
        "sad":    { closed: "A__A\n(o̴̶̷̤`⩌ˊo̴̶̷̤)\n  (ა    ૮)୭", open: "A__A\n(o̴̶̷̤`ᗣˊo̴̶̷̤)\n  (ა    ૮)୭" },
        "angry":  { closed: "A__A\n(o̴̶̷̤`mˊo̴̶̷̤)\n  (ა    ૮)୭", open: "A__A\n(o̴̶̷̤`ᗣˊo̴̶̷̤)\n  (ა    ૮)୭" },
        "confused":  { closed: "A__A\n(o̴̶̷̤`mˊo̴̶̷̤)\n  (ა    ૮)୭", open: "A__A\n?(o̴̶̷̤`ᗣˊo̴̶̷̤)?\n  (ა    ૮)୭" },
    },

        "none":  { closed: "(\\__/)\n(˵•̀⩊•́˶)\n  (ა    ૮)੭", open: "(\\__/)\n(˵•̀∇•́˶)\n  (ა    ૮)੭" },
        "happy":  { closed: "(\\__/)\n(˵•̀⩊•́˶)\n  (ა    ૮)੭", open: "(\\__/)\n⟡(˵•̀∇•́˶)⟡\n    (ა    ૮)੭⁾⁾" },
        "angry":    { closed: "(\\__/)\n(˵•̀ᴖ•́˶)\n  (ა    ૮)੭", open: "(\\__/)\n(˵•̀ᗝ•́˶)\n  (ა    ૮)੭" },
        "sad":  { closed: "(\\__/)\n(˵•́ᴖ•̀˶)\n  (ა    ૮)੭", open: "(\\__/)\n(˵•́ᗝ•̀˶)\n  (ა    ૮)੭" },
        "confused":  { closed: "(\\__/)\n(˵•́ᴖ•̀˶)\n  (ა    ૮)੭", open: "(\\__/)\n?(˵•́ᗝ•̀˶)?\n  (ა    ૮)੭" }
    },
    "radio_robot": {

        "none":  { closed: "|__/\n[◍°-°◍]\n│[▷]│", open: "|__/\n[◍°ㅁ°◍]\n│[⏸]│" },
        "happy":  { closed: "|__/\n[◍°-°◍]\n│[▷]│", open: "|__/\n♫[◍°ㅁ°◍]♫\n│[⏸]│" },
        "sad":    { closed: "|__/\n[◍°-°◍]\n│[▷]│", open: "|__/\n[◍°⌓°◍]\n│[⏸]│" },
        "angry":  { closed: "|__/\n[◍#-#◍]\n│[!!]│", open: "\\__/\n[◍#0#◍]\n│[↺]│" },
        "confused":    { closed: "|__/\n[◍°-°◍]\n│[?]│", open: "|__/\n?[◍°⌓°◍]?\n│[↺]│" }
    },    
    "chubby_hamster": {
        "name": "Hamster",
        "none":  { closed: "⑅ᐢ---ᐢ \n(♡´︿`♡)\n(ა       ૮)", open: "⑅ᐢ---ᐢ \n(♡´𓋰`♡)\n(ა       ૮)" },
        "happy":  { closed: "⑅ᐢ---ᐢ \n(♡´︿`♡)\n(ა       ૮)", open: "⑅ᐢ---ᐢ \n❀(♡´𓋰`♡)❀\n(ა       ૮)" },
        "sad":    { closed: "⑅ᐢ---ᐢ \n(♡´︿`♡)\n(ა       ૮)", open: "⑅ᐢ---ᐢ \n     (♡´ᯅ`ς)՞°·.\n(っ       )" },
        "angry":  { closed: "⑅ᐢ---ᐢ \n( ´︿` )\n(ა       ૮)", open: "⑅ᐢ---ᐢ \n( ´𓋰`ꐦ)\n(ა       ૮)" },
        "confused":  { closed: "⑅ᐢ---ᐢ \n(♡´︿`♡)\n(ა       ૮)", open: "⑅ᐢ---ᐢ \n?(♡´𓋰`♡)?\n(ა       ૮)" }
    },
    "chirp_bird": {
        "name": "Bird",
        "none":  { closed: "𑣲\n(·ө·)\nଘ(⋋⋌)ଓ", open: "𑣲\n(·◇·)\n꒰ঌ(⋋⋌)໒꒱" },
        "happy":  { closed: "𑣲\n(·ө·)\nଘ(⋋⋌)ଓ", open: "𑣲\n♪(·◇·)♪\n꒰ঌ(⋋⋌)໒꒱" },
        "sad":    { closed: "𑣲\n(߹ө߹)\nଘ(⋋⋌)ଓ", open: "𑣲\n(߹◇߹)\nଘ(⋋⋌)ଓ" },
        "angry":  { closed: "𑣲\n(°ө°)\nଘ(⋋⋌)ଓ", open: "𑣲\n(>◇<)\n₍₍⚞(⋋⋌)⚟⁾⁾" },
        "confused":  { closed: "𑣲\n(·ө·)\nଘ(⋋⋌)ଓ", open: "𑣲\n?(·◇·)?\n꒰ঌ(⋋⋌)໒꒱" }
    }
};

// UI Reactive Application states
let currentSkin = "default_cat";
let currentEmotion = "happy";
let isSpeaking = false;
let mouthOpen = false;

let mediaRecorder;
let audioChunks = [];
let lastResponseAudioUrl = "";

// Element Selectors
const selectionScreen = document.getElementById("selection-screen");
const mainScreen = document.getElementById("main-screen");
const skinGrid = document.getElementById("skin-grid");
const asciiDisplay = document.getElementById("ascii-art");
const recordBtn = document.getElementById("record-btn");
const playBtn = document.getElementById("play-btn");
const statusText = document.getElementById("status");
const changeCharBtn = document.getElementById("change-char-btn");

// =====================================================================
// 2. GENERATE THE SELECTION GRID DYNAMICALLY
// =====================================================================
function buildSelectionMenu() {
    skinGrid.innerHTML = "";
    Object.keys(CHARACTER_REGISTRY).forEach(key => {
        const char = CHARACTER_REGISTRY[key];
        const card = document.createElement("div");
        card.className = "skin-card";
        card.innerHTML = `
            <div class="skin-preview">${char.happy.closed}</div>
            <strong>${char.name}</strong>
        `;
        card.addEventListener("click", () => selectCharacter(key));
        skinGrid.appendChild(card);
    });
}

function selectCharacter(skinKey) {
    currentSkin = skinKey;
    currentEmotion = "happy"; // resets to happy on choice
    isSpeaking = false;
    
    selectionScreen.style.display = "none";
    mainScreen.style.display = "block";
    renderFrame();
}

// Return back to selection screen action
changeCharBtn.addEventListener("click", () => {
    mainScreen.style.display = "none";
    selectionScreen.style.display = "block";
});

// =====================================================================
// 3. STOP-MOTION ANIMATION TICK LOOP
// =====================================================================
function renderFrame() {
    const skinData = CHARACTER_REGISTRY[currentSkin][currentEmotion];
    if (isSpeaking) {
        asciiDisplay.textContent = mouthOpen ? skinData.open : skinData.closed;
    } else {
        asciiDisplay.textContent = skinData.closed;
    }
}

setInterval(() => {
    if (isSpeaking) {
        mouthOpen = !mouthOpen;
    }
    renderFrame();
}, 230); // Slight animation timing modification

// Initialize Layout View
buildSelectionMenu();

// =====================================================================
// 4. MICROPHONE DATA STREAM PIPELINE
// =====================================================================
recordBtn.addEventListener("click", async () => {
    if (mediaRecorder && mediaRecorder.state === "recording") {
        mediaRecorder.stop();
        recordBtn.textContent = "Record Input";
        recordBtn.classList.remove("recording");
        statusText.textContent = "Status: Transmitting audio...";
    } else {
        audioChunks = [];
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream);
        
        mediaRecorder.ondataavailable = (event) => audioChunks.push(event.data);
        mediaRecorder.onstop = async () => {
            // MediaRecorder emits the browser's native container
            // (webm/ogg/mp4), NOT wav — label the blob truthfully so
            // the backend knows the real format it received.
            const mimeType = mediaRecorder.mimeType || "audio/webm";
            const audioBlob = new Blob(audioChunks, { type: mimeType });
            await sendToFlaskBackend(audioBlob);
        };

        mediaRecorder.start();
        recordBtn.textContent = "Stop Recording";
        recordBtn.classList.add("recording");
        statusText.textContent = "Status: Listening...";
    }
});

async function sendToFlaskBackend(blob) {
    const formData = new FormData();
    const extension = blob.type.includes("ogg") ? "ogg"
        : blob.type.includes("mp4") ? "mp4"
        : blob.type.includes("wav") ? "wav" : "webm";
    formData.append("file", blob, `user_mic_input.${extension}`);
    formData.append("current_skin", currentSkin);

    // 1. SET STATUS IMMEDIATELY TO "Thinking..." DURING DYNAMIC GENERATION
    statusText.textContent = "Status: Thinking...";
    playBtn.disabled = true; // Clear the play button while thinking

    try {
        const response = await fetch("/api/process-audio", {
            method: "POST",
            body: formData
        });
        
        if (!response.ok) throw new Error("Server communication glitch");
        
        const data = await response.json();
        
        // Cache bust the audio stream with a timestamp
        lastResponseAudioUrl = data.audio_url + "?t=" + new Date().getTime();
        currentSkin = data.skin || currentSkin; 
        currentEmotion = data.emotion || currentEmotion;
        
        // 2. CHANGE STATUS TO INDICATE THE BUFFER PERIOD
        statusText.textContent = "Status: Loading audio tracks...";
        renderFrame();

        // 3. THE FIXED BUFFERED DELAY (350ms to clear the OS file lock safely)
        setTimeout(() => {
            playBtn.disabled = false;
            triggerAudioPlayback();
        }, 350); 

    } catch (err) {
        console.error("Transmission breakdown details:", err);
        statusText.textContent = "Status: Endpoint error.";
        playBtn.disabled = true;
    }
}


playBtn.addEventListener("click", () => {
    if (!lastResponseAudioUrl) return;
    const audio = new Audio(lastResponseAudioUrl);
    isSpeaking = true;
    statusText.textContent = "Status: Character speaking...";

    audio.onended = () => {
        isSpeaking = false;
        statusText.textContent = "Status: Idle";
    };
    audio.play();
});

// Universal playback engine function shared by both autoplay and the replay button
function triggerAudioPlayback() {
    if (!lastResponseAudioUrl) return;
    
    const audio = new Audio(lastResponseAudioUrl);
    isSpeaking = true;
    statusText.textContent = "Status: Character speaking...";
    
    audio.onended = () => {
        isSpeaking = false;
        statusText.textContent = "Status: Idle";
    };
    
    // Play sound (Modern browsers allow autoplay here because it is a direct result of a user click action)
    audio.play().catch(err => {
        console.warn("Autoplay blocked by browser policy. Please click 'Play Last Reply' manually.", err);
        statusText.textContent = "Status: Autoplay blocked. Use manual button.";
        isSpeaking = false;
    });
}

// Keep your standard click event listener targeting the shared engine
playBtn.addEventListener("click", () => {
    triggerAudioPlayback();
});


</script>

</html>
