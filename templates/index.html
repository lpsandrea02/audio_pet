<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Audio Companion</title>
    <style>
        body {
            background-color: #eadbba;
            color: #282525;
            font-family: sans-serif, Consolas, Menlo, Monaco, "Courier New", monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .character-box {
            background-color: #f4e8d0;
            border: 3px solid #eccb93;
            border-radius: 12px;
            padding: 30px;
            text-align: center;
            min-width: 250px;
            box-shadow: 0 8px 16px rgba(198, 198, 198, 0.5);
        }
        .ascii-display {
            white-space: pre;
            font-size: 24px;
            line-height: 1.4;
            margin-bottom: 25px;
            min-height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1.1; /* Gives it a clean, readable layout */

        }
        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        button {
            background-color: #e0c182;
            color: rgb(10, 9, 9);
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background-color: #c6ac80; }
        button.recording { background-color: #cc241d; }
        .status-text {
            margin-top: 15px;
            font-size: 12px;
            color: #414040;
        }
    </style>
</head>
<body>

    <div class="character-box">
        <!-- The live drawing engine updates this element frame-by-frame -->
        <div id="ascii-art" class="ascii-display"></div>
        
        <div class="controls">
            <button id="record-btn">Record Input</button>
            <button id="play-btn" disabled>Play Last Reply</button>
        </div>
        <div id="status" class="status-text">Status: Idle</div>
    </div>

<script>

// =====================================================================
// 1. FRONT-END ASCII STATE REGISTRY
// =====================================================================
const CHARACTER_REGISTRY = {
    "default_cat": {
        "happy":  { closed: "/\\_/\\\n(⌯ˆᵕˆ⌯)\n (ა   ૮)꠹", open: "/\\_/\\\n(⌯ˆoˆ⌯)\n (ᐢ   ᐢ)꠹" },
        "sad":    { closed: "/\\_/\\\n(⌯˃ᴖ˂⌯)\n (ა   ૮)꠹", open: "/\\_/\\\n(⌯˃̣̣̥૦˂̣̣̥⌯)\n (ა   ૮)꠹" },
        "angry":  { closed: "/\\_/\\\n(⌯˃ᴖ˂⌯)\n (ა   ૮)꠹", open: "/\\_/\\\n(⌯˃o˂⌯)\n (ა   ૮)꠹" }
    },
    "evil_villain": {
        "happy":  { closed: "A__A\n(o̴̶̷̤`wˊo̴̶̷̤)\n  (ა    ૮)୭", open: "A__A\n(o̴̶̷̤`⩌ˊo̴̶̷̤)\n  (ა    ૮)୭" },
        "sad":    { closed: "A__A\n(o̴̶̷̤`⩌ˊo̴̶̷̤)\n  (ა    ૮)୭", open: "A__A\n(o̴̶̷̤`ᗣˊo̴̶̷̤)\n  (ა    ૮)୭" },
        "angry":  { closed: "A__A\n(o̴̶̷̤`mˊo̴̶̷̤)\n  (ა    ૮)୭", open: "A__A\n(o̴̶̷̤`ᗣˊo̴̶̷̤)\n  (ა    ૮)୭" }
    },
    "tiny_dog": {
        "happy":  { closed: "(\\__/)\n(˵•̀⩊•́˶)\n  (ა    ૮)੭", open: "(\\__/)\n(˵•̀∇•́˶)\n  (ა    ૮)੭" },
        "sad":    { closed: "(\\__/)\n(˵•̀ᴖ•́˶)\n  (ა    ૮)੭", open: "(\\__/)\n(˵•̀ᗝ•́˶)\n  (ა    ૮)੭" },
        "angry":  { closed: "(\\__/)\n(˵•́ᴖ•̀˶)\n  (ა    ૮)੭", open: "(\\__/)\n(˵•́ᗝ•̀˶)\n  (ა    ૮)੭" }
    },
    "radio_robot": {
        "happy":  { closed: "|__/\n[◍°-°◍]\n│[▷]│", open: "|__/\n[◍°ㅁ°◍]\n│[⏸]│" },
        "sad":    { closed: "|__/\n[◍°-°◍]\n│[▷]│", open: "|__/\n[◍°⌓°◍]\n│[⏸]│" },
        "angry":  { closed: "|__/\n[◍#-#◍]\n│[!!]│", open: "\\__/\n[◍#0#◍]\n│[↺]│" }
    },    
    "chubby_hamster": {
        "happy":  { closed: "⑅ᐢ---ᐢ \n(♡´︿`♡)\n(ა       ૮)", open: "⑅ᐢ---ᐢ \n(♡´𓋰`♡)\n(ა       ૮)" },
        "sad":    { closed: "⑅ᐢ---ᐢ \n(♡´︿`♡)\n(ა       ૮)", open: "⑅ᐢ---ᐢ \n     (♡´ᯅ`ς)՞°·.\n(っ       )" },
        "angry":  { closed: "⑅ᐢ---ᐢ \n( ´︿` )\n(ა       ૮)", open: "⑅ᐢ---ᐢ \n( ´𓋰`ꐦ)\n(ა       ૮)" }
    }
};

// Application reactive states
let currentSkin = "radio_robot";
let currentEmotion = "happy";
let isSpeaking = false;
let mouthOpen = false;

let mediaRecorder;
let audioChunks = [];
let lastResponseAudioUrl = "";

// Element Selectors
const asciiDisplay = document.getElementById("ascii-art");
const recordBtn = document.getElementById("record-btn");
const playBtn = document.getElementById("play-btn");
const statusText = document.getElementById("status");

// =====================================================================
// 2. STOP-MOTION ANIMATION ENGINE LOOP
// =====================================================================
function renderFrame() {
    const skinData = CHARACTER_REGISTRY[currentSkin][currentEmotion];
    if (isSpeaking) {
        asciiDisplay.textContent = mouthOpen ? skinData.open : skinData.closed;
    } else {
        asciiDisplay.textContent = skinData.closed;
    }
}

// Tick loop running at a standard animation rhythm (every 250ms)
setInterval(() => {
    if (isSpeaking) {
        mouthOpen = !mouthOpen; // Flip frames
    }
    renderFrame();
}, 250);

// Initialize view
renderFrame();

// =====================================================================
// 3. AUDIO HARDWARE CONTROLS & PIPELINE FETCH
// =====================================================================
recordBtn.addEventListener("click", async () => {
    if (mediaRecorder && mediaRecorder.state === "recording") {
        mediaRecorder.stop();
        recordBtn.textContent = "Record Input";
        recordBtn.classList.remove("recording");
        statusText.textContent = "Status: Uploading audio package...";
    } else {
        audioChunks = [];
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream);
        
        mediaRecorder.ondataavailable = (event) => {
            audioChunks.push(event.data);
        };

        mediaRecorder.onstop = async () => {
            const audioBlob = new Blob(audioChunks, { type: "audio/wav" });
            await sendToFlaskBackend(audioBlob);
        };

        mediaRecorder.start();
        recordBtn.textContent = "Stop Recording";
        recordBtn.classList.add("recording");
        statusText.textContent = "Status: Listening to mic input...";
    }
});

async function sendToFlaskBackend(blob) {
    const formData = new FormData();
    formData.append("file", blob, "user_mic_input.wav");
    formData.append("current_skin", currentSkin);
    formData.append("current_emotion", currentEmotion);

    try {
        const response = await fetch("/api/process-audio", {
            method: "POST",
            body: formData
        });
        const data = await response.json();
        
        // Save targeted pipeline feedback strings
        lastResponseAudioUrl = data.audio_url;
        currentSkin = data.skin;
        currentEmotion = data.emotion;
        
        playBtn.disabled = false;
        statusText.textContent = "Status: Done. Ready to play response.";
        renderFrame();
    } catch (err) {
        console.error("Backend transmission failed:", err);
        statusText.textContent = "Status: Error processing backend pipeline.";
    }
}

playBtn.addEventListener("click", () => {
    if (!lastResponseAudioUrl) return;
    
    const audio = new Audio(lastResponseAudioUrl);
    isSpeaking = true;
    statusText.textContent = "Status: Character is speaking...";
    
    audio.onended = () => {
        isSpeaking = false;
        statusText.textContent = "Status: Idle";
    };
    
    audio.play();
});
</script>
</body>
</html>
