<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audiopet: Character Audio Companion</title>
    <style>
        /* Theme variables: light (default) */
        body {
            --bg: #eadbba;
            --text: #282525;
            --panel-bg: #f4e8d0;
            --panel-border: #eccb93;
            --card-bg: #fffefa;
            --card-border: #ead7ba;
            --card-border-hover: #dbc69e;
            --btn-bg: #e0c182;
            --btn-hover: #c6ac80;
            --btn-text: rgb(10, 9, 9);
            --muted-text: #aaa;
            --status-text: #414040;
        }
        /* Theme variables: dark mode (white text, dark interface) */
        body.dark-mode {
            --bg: #242220;
            --text: #f4e8d0;
            --panel-bg: #2e2b28;
            --panel-border: #4a453e;
            --card-bg: #38342f;
            --card-border: #4a453e;
            --card-border-hover: #6b6257;
            --btn-bg: #4a453e;
            --btn-hover: #635c51;
            --btn-text: #f4e8d0;
            --muted-text: #8f887d;
            --status-text: #c9c2b6;
        }
        body {
            background-color: var(--bg);
            color: var(--text);
            /* UI font is switchable from the settings menu; the ASCII
               character display keeps its own fixed font (see
               .ascii-display) so the art alignment never changes. */
            font-family: var(--ui-font, sans-serif, Consolas, Menlo, Monaco, "Courier New", monospace);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        /* Selection Screen Layout */
        .selection-screen {
            background-color: var(--panel-bg);
            border: 3px solid var(--panel-border);
            border-radius: 12px;
            padding: 35px;
            text-align: center;
            max-width: 600px;
            box-shadow: 0 8px 16px rgba(198, 198, 198, 0.5);
        }
        .skin-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 15px;
            margin-top: 25px;
        }
        .skin-card {
            background-color: var(--card-bg);
            border: 2px solid var(--card-border);
            border-radius: 8px;
            padding: 15px;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s;
        }
        .skin-card:hover {
            transform: translateY(-3px);
            border-color: var(--card-border-hover);
        }
        .skin-preview {
            white-space: pre;
            font-size: 14px;
            line-height: 1.2;
            margin-bottom: 10px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            /* Fixed font: selection-screen ASCII art must never be
               reflowed or re-styled by the settings font (it breaks
               the art alignment, e.g. in Times New Roman) */
            font-family: sans-serif, Consolas, Menlo, Monaco, "Courier New", monospace;
        }
        /* Main Interaction Screen (Hidden initially) */
        .character-box {
            display: none; /* Controlled via JS */
            background-color: var(--panel-bg);
            border: 3px solid var(--panel-border);
            border-radius: 12px;
            padding: 30px;
            text-align: center;
            min-width: 300px;
            box-shadow: 0 8px 16px rgba(198, 198, 198, 0.5);
        }
        .ascii-display {
            white-space: pre;
            font-size: 24px;
            line-height: 1.2;
            margin-bottom: 25px;
            min-height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            user-select: none;
            /* Fixed font: the ASCII art must never reflow when the UI
               font is changed in the settings menu */
            font-family: sans-serif, Consolas, Menlo, Monaco, "Courier New", monospace;
        }
        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        button {
            background-color: var(--btn-bg);
            color: var(--btn-text);
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            /* Form controls do not inherit the body font by default;
               force inheritance so the settings font applies here too */
            font-family: inherit;
        }
        button:hover { background-color: var(--btn-hover); }
        button.recording { background-color: #cc241d; color: #fff; }
        .status-text {
            margin-top: 15px;
            font-size: 12px;
            color: var(--status-text);
        }
        .back-btn {
            margin-top: 20px;
            font-size: 11px;
            padding: 6px 12px;
        }
        /* Interactive mode row: settings + interactive buttons side by side */
        .back-btn-row {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 20px;
        }
        .back-btn-row .back-btn { margin-top: 0; }
        button.talking { background-color: #cc241d; color: #fff; }
        /* Settings menu overlay */
        .settings-overlay {
            display: none; /* Controlled via JS */
            position: fixed;
            inset: 0;
            background-color: rgba(40, 37, 37, 0.45);
            align-items: center;
            justify-content: center;
            z-index: 100;
        }
        .settings-menu {
            position: relative;
            background-color: var(--panel-bg);
            border: 3px solid var(--panel-border);
            border-radius: 12px;
            padding: 30px 40px;
            text-align: center;
            min-width: 240px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.35);
        }
        .settings-menu h3 { margin-top: 0; }
        .settings-close {
            position: absolute;
            top: 8px;
            right: 8px;
            padding: 4px 10px;
            font-size: 12px;
            background-color: #cc241d;
            color: #fff;
        }
        .settings-action { display: block; width: 100%; margin-bottom: 18px; }
        .setting-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 12px;
            font-size: 13px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- SCREEN 1: SELECT CHARACTER -->
    <div id="selection-screen" class="selection-screen">
        <h2>Select Your Audiopet</h2>
        <p style="color: var(--muted-text);">Choose one of 5 characters to get started:</p>
        <div class="skin-grid" id="skin-grid"></div>
    </div>

    <!-- SCREEN 2: MAIN AUDIO EXPERIENCE -->
    <div id="main-screen" class="character-box">
        <div id="ascii-art" class="ascii-display"></div>
        <div class="controls">
            <button id="record-btn">◉ ︎Record Input</button>
            <button id="play-btn" disabled>▶ Play Last Reply</button>
            <button id="talk-btn" style="display:none">🎤︎ Start Talking</button>
        </div>
        <div id="status" class="status-text">Status: Idle</div>
        <div class="back-btn-row">
            <button id="settings-btn" class="back-btn">⚙ Settings</button>
            <button id="interactive-btn" class="back-btn">✿ Interactive Mode</button>
        </div>
    </div>

    <!-- SETTINGS MENU OVERLAY -->
    <div id="settings-overlay" class="settings-overlay">
        <div class="settings-menu">
            <button id="settings-close-btn" class="settings-close">X</button>
            <h3>Settings</h3>
            <button id="swap-character-btn" class="settings-action">Swap Character</button>
            <label class="setting-row">Volume
                <input type="range" id="volume-slider" min="0" max="100" value="100">
            </label>
            <label class="setting-row">Idle character noises
                <input type="checkbox" id="idle-noise-toggle" checked>
            </label>
            <label class="setting-row">Dark mode

            </label>
            <label class="setting-row">Font
                <select id="font-select">

                    <option value="'Comic Sans MS', 'Comic Sans', cursive" selected>Comic Sans MS</option>

            </label>

    </div>

        "happy":  { closed: "𑣲\n(·ө·)\nଘ(⋋⋌)ଓ", open: "𑣲\n♪(·◇·)♪\n꒰ঌ(⋋⋌)໒꒱" },
        "sad":    { closed: "𑣲\n(߹ө߹)\nଘ(⋋⋌)ଓ", open: "𑣲\n(߹◇߹)\nଘ(⋋⋌)ଓ" },
        "angry":  { closed: "𑣲\n(°ө°)\nଘ(⋋⋌)ଓ", open: "𑣲\n(>◇<)\n₍₍⚞(⋋⋌)⚟⁾⁾" },
        "confused":  { closed: "𑣲\n(·ө·)\nଘ(⋋⋌)ଓ", open: "𑣲\n?(·◇·)?\n꒰ঌ(⋋⋌)໒꒱" }

// UI Reactive Application states
let currentSkin = "default_cat";
let currentEmotion = "happy";
let isSpeaking = false;
let mouthOpen = false;

let mediaRecorder;
let audioChunks = [];
let lastResponseAudioUrl = "";

// Clickable character state: consecutive poke counter + the currently
// playing click-noise audio element. Click noises are deliberately
// NEVER cached into lastResponseAudioUrl so the "Play Last Reply"
// button can never replay system_noise.wav.
let clickCount = 0;
let noiseAudio = null;

// Idle character noises: the character emits idle noises after a
// randomly spaced silence threshold (drawn by the backend), up to a
// fixed number of noises, after which a final sad noise plays once
// and the character stays silent until the next interaction.
let idleCount = 0;
let idleTimer = null;
let idleEnabled = true;     // toggled from the settings menu
let idleSilenced = false;   // True once the final sad noise has played
let masterVolume = 1.0;     // controlled from the settings menu

// Interactive mode: full-duplex streaming conversation. While active,
// the record/play controls are replaced by a single Start Talking /
// Pause Recording button and audio is streamed to the backend in short
// chunks for continuous note detection.
let interactiveMode = false;        // ☁︎ button toggles this
let streamingActive = false;        // Start Talking / Pause Recording
let interactiveStream = null;
let interactiveAudioCtx = null;
let interactiveSource = null;
let interactiveProcessor = null;
let interactiveSilenceGain = null;
let interactiveReplyAudio = null;   // fallback media-element reply audio
let interactiveReplySource = null;  // Web Audio reply source (unblocked)
let interactivePetSpeaking = false; // reply audio currently playing
let interactiveChunkBuffer = [];    // Float32 blocks for the next chunk
let interactiveChunkSamples = 0;    // samples per ~0.5s chunk
let interactiveSendChain = Promise.resolve(); // serialize chunk posts
let interactivePrevIdleEnabled = true; // idle noises paused in mode
const INTERACTIVE_CHUNK_SECONDS = 0.5; // streamed chunk length

// Element Selectors
const selectionScreen = document.getElementById("selection-screen");
const mainScreen = document.getElementById("main-screen");
const skinGrid = document.getElementById("skin-grid");
const asciiDisplay = document.getElementById("ascii-art");
const recordBtn = document.getElementById("record-btn");
const playBtn = document.getElementById("play-btn");
const statusText = document.getElementById("status");

// =====================================================================
// 2. GENERATE THE SELECTION GRID DYNAMICALLY
// =====================================================================
function buildSelectionMenu() {
    skinGrid.innerHTML = "";
    Object.keys(CHARACTER_REGISTRY).forEach(key => {
        const char = CHARACTER_REGISTRY[key];
        const card = document.createElement("div");
        card.className = "skin-card";
        card.innerHTML = `
            <div class="skin-preview">${char.happy.closed}</div>
            <strong>${char.name}</strong>
        `;
        card.addEventListener("click", () => selectCharacter(key));
        skinGrid.appendChild(card);
    });
}

function selectCharacter(skinKey) {
    currentSkin = skinKey;
    currentEmotion = "happy"; // resets to happy on choice
    isSpeaking = false;
    clickCount = 0; // fresh pet, fresh patience
    
    selectionScreen.style.display = "none";
    mainScreen.style.display = "block";
    renderFrame();
    resetIdleCycle();
}

// Return back to selection screen action is handled by the Settings
// menu's "Swap Character" button (section 7).

// =====================================================================
// 3. STOP-MOTION ANIMATION TICK LOOP
// =====================================================================
function renderFrame() {
    const skinData = CHARACTER_REGISTRY[currentSkin][currentEmotion];
    if (isSpeaking) {
        asciiDisplay.textContent = mouthOpen ? skinData.open : skinData.closed;
    } else {
        asciiDisplay.textContent = skinData.closed;
    }
}

setInterval(() => {
    if (isSpeaking) {
        mouthOpen = !mouthOpen;
    }
    renderFrame();
}, 230); // Slight animation timing modification

// Initialize Layout View
buildSelectionMenu();

// =====================================================================
// 4. MICROPHONE DATA STREAM PIPELINE
// =====================================================================
recordBtn.addEventListener("click", async () => {
    resetIdleCycle();
    if (mediaRecorder && mediaRecorder.state === "recording") {
        mediaRecorder.stop();
        recordBtn.textContent = "Record Input";
        recordBtn.classList.remove("recording");
        statusText.textContent = "Status: Transmitting audio...";
    } else {
        audioChunks = [];
        clickCount = 0; // a direct interaction calms the pet down
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream);
        
        mediaRecorder.ondataavailable = (event) => audioChunks.push(event.data);
        mediaRecorder.onstop = async () => {
            // MediaRecorder emits the browser's native container
            // (webm/ogg/mp4), NOT wav — label the blob truthfully so
            // the backend knows the real format it received.
            const mimeType = mediaRecorder.mimeType || "audio/webm";
            const audioBlob = new Blob(audioChunks, { type: mimeType });
            await sendToFlaskBackend(audioBlob);
        };

        mediaRecorder.start();
        recordBtn.textContent = "Stop Recording";
        recordBtn.classList.add("recording");
        statusText.textContent = "Status: Listening...";
    }
});

async function sendToFlaskBackend(blob) {
    const formData = new FormData();
    const extension = blob.type.includes("ogg") ? "ogg"
        : blob.type.includes("mp4") ? "mp4"
        : blob.type.includes("wav") ? "wav" : "webm";
    formData.append("file", blob, `user_mic_input.${extension}`);
    formData.append("current_skin", currentSkin);

    // 1. SET STATUS IMMEDIATELY TO "Thinking..." DURING DYNAMIC GENERATION
    statusText.textContent = "Status: Thinking...";
    playBtn.disabled = true; // Clear the play button while thinking

    try {
        const response = await fetch("/api/process-audio", {
            method: "POST",
            body: formData
        });
        
        if (!response.ok) throw new Error("Server communication glitch");
        
        const data = await response.json();
        
        // Cache bust the audio stream with a timestamp
        lastResponseAudioUrl = data.audio_url + "?t=" + new Date().getTime();
        currentSkin = data.skin || currentSkin; 
        currentEmotion = data.emotion || currentEmotion;
        
        // 2. CHANGE STATUS TO INDICATE THE BUFFER PERIOD
        statusText.textContent = "Status: Loading audio tracks...";
        renderFrame();

        // 3. THE FIXED BUFFERED DELAY (350ms to clear the OS file lock safely)
        setTimeout(() => {
            playBtn.disabled = false;
            triggerAudioPlayback();
        }, 350); 

    } catch (err) {
        console.error("Transmission breakdown details:", err);
        statusText.textContent = "Status: Endpoint error.";
        playBtn.disabled = true;
    }
}


playBtn.addEventListener("click", () => {
    if (!lastResponseAudioUrl) return;
    triggerAudioPlayback();
});

// Universal playback engine function shared by both autoplay and the replay button
function triggerAudioPlayback() {
    if (!lastResponseAudioUrl) return;
    resetIdleCycle();
    
    const audio = new Audio(lastResponseAudioUrl);
    audio.volume = masterVolume;
    isSpeaking = true;
    statusText.textContent = "Status: Character speaking...";
    
    audio.onended = () => {
        isSpeaking = false;
        statusText.textContent = "Status: Idle";
    };
    
    // Play sound (Modern browsers allow autoplay here because it is a direct result of a user click action)
    audio.play().catch(err => {
        console.warn("Autoplay blocked by browser policy. Please click 'Play Last Reply' manually.", err);
        statusText.textContent = "Status: Autoplay blocked. Use manual button.";
        isSpeaking = false;
    });
}

// Keep your standard click event listener targeting the shared engine
playBtn.addEventListener("click", () => {
    triggerAudioPlayback();
});

// =====================================================================
// 5. CLICKABLE CHARACTER (POKE -> CLICK NOISE)
// =====================================================================
// Poking the character asks the backend to synthesise a happy noise
// (or a forced angry noise once the pet has been poked too many times)
// into system_noise.wav. The noise is played immediately from the
// user-gesture click, but is never cached into lastResponseAudioUrl,
// so the "Play Last Reply" button cannot replay it.
asciiDisplay.addEventListener("click", async () => {
    clickCount += 1;
    resetIdleCycle();
    statusText.textContent = "Status: Poked!";

    const formData = new FormData();
    formData.append("current_skin", currentSkin);
    formData.append("click_count", clickCount);

    try {
        const response = await fetch("/api/character-click", {
            method: "POST",
            body: formData
        });
        if (!response.ok) throw new Error("Server communication glitch");
        const data = await response.json();
        playClickNoise(data.audio_url + "?t=" + new Date().getTime(),
                       data.emotion);
    } catch (err) {
        console.error("Click noise transmission breakdown:", err);
        statusText.textContent = "Status: Endpoint error.";
    }
});

function playClickNoise(url, emotion, keepEmotion = false) {
    // Cut off any previously playing noise so rapid pokes don't stack
    if (noiseAudio) {
        noiseAudio.pause();
    }

    noiseAudio = new Audio(url);
    noiseAudio.volume = masterVolume;
    const prevEmotion = currentEmotion;
    currentEmotion = emotion || prevEmotion;
    isSpeaking = true;
    statusText.textContent = "Status: Character reacting...";
    renderFrame();

    noiseAudio.onended = () => {
        isSpeaking = false;
        // The final sad idle noise lingers: the character stays in sad
        // mode visually until a new user recording resets the emotion.
        if (!keepEmotion) {
            currentEmotion = prevEmotion;
        }
        statusText.textContent = "Status: Idle";
    };

    // Autoplay is allowed here because playback originates directly
    // from the user's click on the character
    noiseAudio.play().catch(err => {
        console.warn("Noise playback blocked by browser policy.", err);
        isSpeaking = false;
        if (!keepEmotion) {
            currentEmotion = prevEmotion;
        }
        statusText.textContent = "Status: Autoplay blocked.";
    });
}

// =====================================================================
// 6. IDLE CHARACTER NOISES (randomly spaced idle melodic noises)
// =====================================================================
// Idle noises are requested from the backend after a random delay so
// spacing between consecutive noises is never fixed. Any user
// interaction resets the idle cycle. After IDLE_NOISE_MAX_COUNT noises
// the backend delivers the sad noise once (is_final) and the timer is
// permanently stopped until the next interaction.

function stopIdleTimer() {
    if (idleTimer) {
        clearTimeout(idleTimer);
        idleTimer = null;
    }
}

// Called on every user interaction: restarts the full idle cycle.
function resetIdleCycle() {
    idleCount = 0;
    idleSilenced = false;
    scheduleNextIdleNoise();
}

async function scheduleNextIdleNoise() {
    stopIdleTimer();
    if (!idleEnabled || idleSilenced) return;
    let delaySeconds;
    try {
        const response = await fetch("/api/idle-delay");
        if (!response.ok) throw new Error("Server communication glitch");
        const data = await response.json();
        delaySeconds = data.delay;
    } catch (err) {
        // Fail-safe local draw if the delay endpoint is unreachable
        delaySeconds = 8 + Math.random() * 12;
    }
    idleTimer = setTimeout(triggerIdleNoise, delaySeconds * 1000);
}

async function triggerIdleNoise() {
    if (!idleEnabled || idleSilenced) return;

    // Never interrupt an ongoing recording or reply playback; just
    // re-schedule instead of counting the skipped window as a noise.
    const isRecording = mediaRecorder && mediaRecorder.state === "recording";
    if (isSpeaking || isRecording) {
        scheduleNextIdleNoise();
        return;
    }

    idleCount += 1;
    const formData = new FormData();
    formData.append("current_skin", currentSkin);
    formData.append("idle_count", idleCount);

    try {
        const response = await fetch("/api/idle-noise", {
            method: "POST",
            body: formData
        });
        if (!response.ok) throw new Error("Server communication glitch");
        const data = await response.json();
        playClickNoise(data.audio_url + "?t=" + new Date().getTime(),
                       data.emotion, Boolean(data.is_final));

        if (data.is_final) {
            // Sad noise delivered: no further idle noises until the
            // user interacts again.
            idleSilenced = true;
            stopIdleTimer();
            return;
        }
        // Random spacing between consecutive idle noises
        idleTimer = setTimeout(triggerIdleNoise,
                               (data.next_delay || 10) * 1000);
    } catch (err) {
        console.error("Idle noise transmission breakdown:", err);
        scheduleNextIdleNoise();
    }
}

// =====================================================================
// 7. SETTINGS MENU (swap character, volume, idle-noise toggle)
// =====================================================================
const settingsBtn = document.getElementById("settings-btn");
const settingsOverlay = document.getElementById("settings-overlay");
const settingsCloseBtn = document.getElementById("settings-close-btn");
const swapCharacterBtn = document.getElementById("swap-character-btn");
const volumeSlider = document.getElementById("volume-slider");
const idleNoiseToggle = document.getElementById("idle-noise-toggle");
const darkModeToggle = document.getElementById("dark-mode-toggle");
const fontSelect = document.getElementById("font-select");

settingsBtn.addEventListener("click", () => {
    settingsOverlay.style.display = "flex";
    resetIdleCycle();
});

settingsCloseBtn.addEventListener("click", () => {
    settingsOverlay.style.display = "none";
    resetIdleCycle();
});

// Swap character returns to the selection screen (same as the old
// swap button at the bottom of the screen)
swapCharacterBtn.addEventListener("click", () => {
    stopIdleTimer();
    settingsOverlay.style.display = "none";
    mainScreen.style.display = "none";
    selectionScreen.style.display = "block";
});

volumeSlider.addEventListener("input", () => {
    masterVolume = volumeSlider.value / 100;
});

idleNoiseToggle.addEventListener("change", () => {
    idleEnabled = idleNoiseToggle.checked;
    if (idleEnabled) {
        resetIdleCycle();
    } else {
        stopIdleTimer();
    }
});

darkModeToggle.addEventListener("change", () => {
    document.body.classList.toggle("dark-mode", darkModeToggle.checked);
});

fontSelect.addEventListener("change", () => {
    if (fontSelect.value === "default") {
        document.body.style.removeProperty("--ui-font");
    } else {
        document.body.style.setProperty("--ui-font", fontSelect.value);
    }
});

// Apply the initially selected font (Comic Sans MS) on page load
if (fontSelect.value !== "default") {
    document.body.style.setProperty("--ui-font", fontSelect.value);
}

// =====================================================================
// 8. INTERACTIVE MODE (full-duplex streaming conversation)
// =====================================================================
// Activating interactive mode hides the record/play controls and shows
// a single Start Talking / Pause Recording button; the ☁︎ button itself
// becomes Exit Interactive Mode. While streaming, the microphone PCM is
// captured continuously and POSTed to the backend as ~0.5s standalone
// WAV chunks, which are normalised and note-detected server-side. When
// enough silence passes after the latest detected note the backend
// renders the accumulated melody and the pet sings it back; if new
// notes arrive while the pet sings, playback is cut immediately and
// only the fresh note sequence is synthesised next.
const interactiveBtn = document.getElementById("interactive-btn");
const talkBtn = document.getElementById("talk-btn");

interactiveBtn.addEventListener("click", () => {
    if (!interactiveMode) {
        enterInteractiveMode();
    } else {
        exitInteractiveMode();
    }
});

talkBtn.addEventListener("click", () => {
    if (!interactiveMode) return;
    if (streamingActive) {
        pauseInteractiveStreaming();
    } else {
        startInteractiveStreaming();
    }
});

async function enterInteractiveMode() {
    interactiveMode = true;
    interactivePrevIdleEnabled = idleEnabled;
    idleEnabled = false; // idle noises are paused during the session
    stopIdleTimer();
    recordBtn.style.display = "none";
    playBtn.style.display = "none";
    talkBtn.style.display = "";
    interactiveBtn.textContent = "➜] Exit Interactive Mode";
    statusText.textContent = "Status: Interactive ready! Press Start Talking.";
    try {
        await fetch("/api/interactive-start", { method: "POST" });
    } catch (err) {
        console.error("Interactive start breakdown:", err);
    }
}

async function exitInteractiveMode() {
    stopInteractiveStreaming();
    stopInteractiveReply();
    interactiveMode = false;
    streamingActive = false;
    recordBtn.style.display = "";
    playBtn.style.display = "";
    talkBtn.style.display = "none";
    talkBtn.textContent = "🎤︎ Start Talking";
    talkBtn.classList.remove("talking");
    interactiveBtn.textContent = "✿ Interactive Mode";
    statusText.textContent = "Status: Idle";
    idleEnabled = interactivePrevIdleEnabled;
    try {
        await fetch("/api/interactive-exit", { method: "POST" });
    } catch (err) {
        console.error("Interactive exit breakdown:", err);
    }
    resetIdleCycle();
}

function stopInteractiveStreaming() {
    if (interactiveProcessor) {
        interactiveProcessor.onaudioprocess = null;
        try { interactiveProcessor.disconnect(); } catch (err) {}
        interactiveProcessor = null;
    }
    if (interactiveSource) {
        try { interactiveSource.disconnect(); } catch (err) {}
        interactiveSource = null;
    }
    if (interactiveSilenceGain) {
        try { interactiveSilenceGain.disconnect(); } catch (err) {}
        interactiveSilenceGain = null;
    }
    if (interactiveAudioCtx) {
        try { interactiveAudioCtx.close(); } catch (err) {}
        interactiveAudioCtx = null;
    }
    if (interactiveStream) {
        interactiveStream.getTracks().forEach(track => track.stop());
        interactiveStream = null;
    }
    interactiveChunkBuffer = [];
    interactiveChunkSamples = 0;
}

// Wraps the PCM samples in a minimal 44-byte header RIFF/WAVE blob so
// every streamed chunk is a standalone, decodable 16-bit wav file.
function buildInteractiveWavBlob(samples, sampleRate) {
    const buffer = new ArrayBuffer(44 + samples.length * 2);
    const view = new DataView(buffer);
    const writeStr = (offset, str) => {
        for (let i = 0; i < str.length; i++) {
            view.setUint8(offset + i, str.charCodeAt(i));
        }
    };
    writeStr(0, "RIFF");
    view.setUint32(4, 36 + samples.length * 2, true);
    writeStr(8, "WAVE");
    writeStr(12, "fmt ");
    view.setUint32(16, 16, true);              // PCM chunk size
    view.setUint16(20, 1, true);               // PCM format
    view.setUint16(22, 1, true);               // mono
    view.setUint32(24, sampleRate, true);
    view.setUint32(28, sampleRate * 2, true);  // byte rate
    view.setUint16(32, 2, true);               // block align
    view.setUint16(34, 16, true);              // bits per sample
    writeStr(36, "data");
    view.setUint32(40, samples.length * 2, true);
    let offset = 44;
    for (let i = 0; i < samples.length; i++) {
        const sample = Math.max(-1, Math.min(1, samples[i]));
        view.setInt16(offset, sample < 0 ? sample * 0x8000 : sample * 0x7FFF, true);
        offset += 2;
    }
    return new Blob([buffer], { type: "audio/wav" });
}

async function startInteractiveStreaming() {
    clickCount = 0; // a direct interaction calms the pet down

    // The AudioContext must be created AND resumed synchronously inside
    // the Start Talking click gesture: once unlocked this way, reply
    // buffers can be scheduled on it programmatically at any later
    // time, bypassing the media-element autoplay block entirely.
    interactiveAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
    try {
        await interactiveAudioCtx.resume();
    } catch (err) {
        console.warn("AudioContext resume blocked in gesture.", err);
    }

    try {
        interactiveStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    } catch (err) {
        console.error("Microphone access breakdown:", err);
        try { interactiveAudioCtx.close(); } catch (closeErr) {}
        interactiveAudioCtx = null;
        statusText.textContent = "Status: Microphone access denied.";
        return;
    }

    interactiveSource = interactiveAudioCtx.createMediaStreamSource(interactiveStream);
    interactiveProcessor = interactiveAudioCtx.createScriptProcessor(4096, 1, 1);
    interactiveChunkSamples = Math.floor(
        interactiveAudioCtx.sampleRate * INTERACTIVE_CHUNK_SECONDS);

    interactiveProcessor.onaudioprocess = (event) => {
        if (!streamingActive) return;
        interactiveChunkBuffer.push(
            new Float32Array(event.inputBuffer.getChannelData(0)));
        const buffered = interactiveChunkBuffer.reduce(
            (sum, block) => sum + block.length, 0);
        if (buffered >= interactiveChunkSamples) {
            const merged = new Float32Array(buffered);
            let offset = 0;
            for (const block of interactiveChunkBuffer) {
                merged.set(block, offset);
                offset += block.length;
            }
            interactiveChunkBuffer = [];
            const blob = buildInteractiveWavBlob(
                merged, interactiveAudioCtx.sampleRate);
            queueInteractiveChunk(blob);
        }
    };

    // ScriptProcessor only fires when connected into the audio graph;
    // route through a zero-gain node so the mic never feeds back out
    // of the speakers.
    interactiveSilenceGain = interactiveAudioCtx.createGain();
    interactiveSilenceGain.gain.value = 0;
    interactiveSource.connect(interactiveProcessor);
    interactiveProcessor.connect(interactiveSilenceGain);
    interactiveSilenceGain.connect(interactiveAudioCtx.destination);

    streamingActive = true;
    talkBtn.textContent = "⏸ Pause Recording";
    talkBtn.classList.add("talking");
    statusText.textContent = "Status: Listening (Interactive)...";
}

function pauseInteractiveStreaming() {
    stopInteractiveStreaming();
    streamingActive = false;
    talkBtn.textContent = "🎤︎ Start Talking";
    talkBtn.classList.remove("talking");
    statusText.textContent = "Status: Interactive paused.";
}

// Chunk posts are serialized so responses (turn ends, interrupts)
// arrive in order and never overlap on the backend.
function queueInteractiveChunk(blob) {
    interactiveSendChain = interactiveSendChain
        .then(() => sendInteractiveChunk(blob))
        .catch(() => {});
}

async function sendInteractiveChunk(blob) {
    const formData = new FormData();
    formData.append("file", blob, "user_interactive_chunk.wav");
    formData.append("current_skin", currentSkin);
    formData.append("pet_speaking",
                    interactivePetSpeaking ? "true" : "false");
    try {
        const response = await fetch("/api/interactive-chunk", {
            method: "POST",
            body: formData
        });
        if (!response.ok) throw new Error("Server communication glitch");
        const data = await response.json();

        if (data.interrupted) {
            // New notes detected while the pet sings: immediately stop
            // singing and listen to the fresh input (the previous
            // melody is already discarded server-side).
            stopInteractiveReply();
            statusText.textContent = "Status: Listening (Interactive)...";
            return;
        }
        if (data.turn_ended && data.audio_url) {
            playInteractiveReply(data.audio_url + "?t=" + new Date().getTime(),
                                 data.emotion);
        }
    } catch (err) {
        console.error("Interactive chunk transmission breakdown:", err);
    }
}

function finishInteractiveReply(prevEmotion) {
    isSpeaking = false;
    interactivePetSpeaking = false;
    interactiveReplySource = null;
    interactiveReplyAudio = null;
    currentEmotion = prevEmotion;
    if (streamingActive) {
        statusText.textContent = "Status: Listening (Interactive)...";
    } else {
        statusText.textContent = "Status: Interactive paused.";
    }
}

async function playInteractiveReply(url, emotion) {
    stopInteractiveReply();
    const prevEmotion = currentEmotion;
    currentEmotion = emotion || prevEmotion;
    interactivePetSpeaking = true;
    isSpeaking = true;
    statusText.textContent = "Status: Character singing (Interactive)...";
    renderFrame();

    try {
        if (!interactiveAudioCtx) throw new Error("No unlocked interactive AudioContext");

        // Fetch + decode + schedule on the unlocked gesture context
        const response = await fetch(url);
        if (!response.ok) throw new Error("Reply fetch failed");
        const arrayBuffer = await response.arrayBuffer();
        const audioBuffer = await interactiveAudioCtx.decodeAudioData(arrayBuffer);

        const source = interactiveAudioCtx.createBufferSource();
        source.buffer = audioBuffer;
        const gain = interactiveAudioCtx.createGain();
        gain.gain.value = masterVolume;
        source.connect(gain);
        gain.connect(interactiveAudioCtx.destination);
        interactiveReplySource = source;
        source.onended = () => finishInteractiveReply(prevEmotion);
        source.start();
    } catch (err) {
        console.warn("Web Audio reply playback failed, falling back to media element.", err);
        // Fallback: the old media-element path (subject to autoplay
        // policy; only a best-effort backup, e.g. context gone while
        // a fresh user gesture just happened).
        interactiveReplyAudio = new Audio(url);
        interactiveReplyAudio.volume = masterVolume;
        interactiveReplyAudio.onended = () => finishInteractiveReply(prevEmotion);
        interactiveReplyAudio.play().catch(playErr => {
            console.warn("Interactive reply playback blocked by browser policy.", playErr);
            isSpeaking = false;
            interactivePetSpeaking = false;
            currentEmotion = prevEmotion;
            statusText.textContent = "Status: Autoplay blocked.";
        });
    }
}

function stopInteractiveReply() {
    if (interactiveReplySource) {
        const source = interactiveReplySource;
        interactiveReplySource = null;
        source.onended = null;
        try { source.stop(); } catch (err) {}
    }
    if (interactiveReplyAudio) {
        interactiveReplyAudio.pause();
        interactiveReplyAudio = null;
    }
    isSpeaking = false;
    interactivePetSpeaking = false;
}

// Swapping characters also leaves interactive mode cleanly
swapCharacterBtn.addEventListener("click", () => {
    if (interactiveMode) {
        exitInteractiveMode();
    }
});

</script>
